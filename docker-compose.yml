services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coverage-chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the Chroma vector store across container restarts instead
      # of losing it when the container is recreated. Mounted at a
      # subdirectory (not over /app) so it never shadows the app code
      # copied into the image.
      - chroma_data:/app/coverage-chatbot-api/chroma_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: coverage-chatbot-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Reach the backend by its compose service name, not localhost.
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:

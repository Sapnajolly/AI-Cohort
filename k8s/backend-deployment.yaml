apiVersion: apps/v1
kind: Deployment
metadata:
  name: coverage-chatbot-backend
  labels:
    app: coverage-chatbot-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coverage-chatbot-backend
  template:
    metadata:
      labels:
        app: coverage-chatbot-backend
    spec:
      containers:
        - name: backend
          image: coverage-chatbot-backend:latest
          imagePullPolicy: IfNotPresent  # image is loaded into Minikube locally, not pulled from a registry
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: coverage-chatbot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
